    <h1>Contacto</h1>
   
    <form method="#" action="#">
        <label for="nombre">Introduzca su nombre</label>
        <br>
        <input id="nombre" name="nombre" type="text" required placeholder="Nombre">
        <br><br>
        <label for="email">Introduzca su email</label>
        <br>
        <input id="email" name="email" type="email" required placeholder="Email">
        <br><br>
        <label for="mensaje">Introduzca un mensaje</label>
        <br>
        <textarea id="mensaje" name="mensaje" placeholder="Mensaje" rows="4" cols="50"></textarea>
        <br><br>
        <label for="contrasena">Introduzca su contraseña</label>
        <br>
        <input type="password" id="contrasena" name="contrasena" required placeholder="Contraseña">
        <br><br>
        <button type="reset">Limpiar</button>
        <button type="submit">Enviar</button>
    </form>
